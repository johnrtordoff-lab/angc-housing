name: Update Houses

on:
  schedule:
    - cron: '0 11 * * *'   # daily, ~7am US Eastern
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch houses
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: node scripts/fetch-houses.js
      - name: Commit and push if changed
        run: |
          git config user.name "angc-housing-bot"
          git config user.email "actions@github.com"
          git add data.json seen-ids.json
          git diff --quiet --cached || git commit -m "Update houses $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
