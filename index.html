<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Augusta National Home Watch</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b3d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANGC Homes">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Augusta National Home Watch</h1>
    <div class="sub" id="updated">Loading&hellip;</div>
    <div class="stats">
      <div class="stat"><div class="num" id="count-total">&ndash;</div><div class="label">Active</div></div>
      <div class="stat"><div class="num" id="count-new">&ndash;</div><div class="label">New</div></div>
      <div class="stat"><div class="num">5mi</div><div class="label">Radius</div></div>
    </div>
  </header>
  <main id="root"></main>
  <footer>For-sale listings within 5 miles of Augusta National Golf Club &middot; data via RentCast</footer>
  <script src="./app.js"></script>
</body>
</html>
